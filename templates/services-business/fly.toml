# Fly.io config for preview deploys of the static site (nginx serving dist/).
# TODO: `app` is set per-client by tooling/create-client.
app = "services-business-preview"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
