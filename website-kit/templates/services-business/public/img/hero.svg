<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Illustration of a tidy financial dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" rx="16" fill="url(#bg)"/>
  <rect x="48" y="60" width="544" height="300" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="72" y="88" width="180" height="16" rx="8" fill="#93c5fd"/>
  <rect x="72" y="120" width="496" height="1" fill="#e2e8f0"/>
  <!-- bars -->
  <g fill="#2563eb">
    <rect x="96" y="250" width="40" height="70" rx="4"/>
    <rect x="168" y="220" width="40" height="100" rx="4"/>
    <rect x="240" y="190" width="40" height="130" rx="4"/>
    <rect x="312" y="160" width="40" height="160" rx="4"/>
    <rect x="384" y="200" width="40" height="120" rx="4"/>
  </g>
  <!-- trend line -->
  <path d="M116 250 L188 220 L260 190 L332 160 L404 200 L500 150" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="500" cy="150" r="6" fill="#1d4ed8"/>
  <!-- summary cards -->
  <rect x="452" y="180" width="116" height="150" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="470" y="200" width="60" height="10" rx="5" fill="#93c5fd"/>
  <rect x="470" y="222" width="80" height="18" rx="6" fill="#1d4ed8"/>
  <rect x="470" y="258" width="60" height="10" rx="5" fill="#93c5fd"/>
  <rect x="470" y="280" width="80" height="18" rx="6" fill="#1d4ed8"/>
</svg>
